<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="heading">
            <h1>To Do List</h1>
        </div>
        <div class="main">
          <div class="input-box">
    <input type="text" placeholder="Add a new task...">
    <button class="add-btn">Add Task</button>
</div>
<div class="task-box">
    <h3 style="font-size: 16px; color: #64748b; margin-bottom: 12px;">Your Tasks</h3>
    <ul class="task" style="list-style: none; padding: 0;"></ul>
</div>
            <div class="btn-container">
                <button class="btn btn-comp">Complete All</button>
                <button class="btn btn-del">Delete All</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
