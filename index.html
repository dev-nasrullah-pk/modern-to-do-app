<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="heading">
            <h1>To Do List</h1>
        </div>
        <div class="main">
            <div class="input-box">
                <input type="text" placeholder="Add Taks">
                <button class="add-btn">Add</button>
            </div>
            <div class="task-box">
                <span class="task">Task</span>
            </div>
            <div class="btn-container">
                <button class="btn btn-comp">Complete All</button>
                <button class="btn btn-del">Delete All</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
